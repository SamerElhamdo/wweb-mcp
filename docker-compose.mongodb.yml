version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: wweb-mcp-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-password}
    networks:
      - wweb-network

  wweb-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wweb-mcp
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:3002"
      - "${API_PORT:-3001}:3001"
    volumes:
      # Mount volume for persistent authentication data
      - wweb-auth:/app/auth_data
    environment:
      # Docker container flag
      - DOCKER_CONTAINER=true
      
      # MongoDB Configuration
      - MONGO_URI=${MONGO_URI:-mongodb://admin:password@mongodb:27017/whatsapp_sessions?authSource=admin}
      
      # Webhook Configuration (from environment variables)
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - WEBHOOK_AUTH_TOKEN=${WEBHOOK_AUTH_TOKEN:-}
      - WEBHOOK_ALLOWED_NUMBERS=${WEBHOOK_ALLOWED_NUMBERS:-}
      - WEBHOOK_ALLOW_PRIVATE=${WEBHOOK_ALLOW_PRIVATE:-true}
      - WEBHOOK_ALLOW_GROUPS=${WEBHOOK_ALLOW_GROUPS:-true}
      
      # Application Configuration
      - MODE=${MODE:-whatsapp-api}
      - MCP_MODE=${MCP_MODE:-standalone}
      - TRANSPORT=${TRANSPORT:-sse}
      - SSE_PORT=${SSE_PORT:-3002}
      - AUTH_DATA_PATH=/app/auth_data
      - AUTH_STRATEGY=${AUTH_STRATEGY:-json}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - ENABLE_SESSIONS=${ENABLE_SESSIONS:-true}
    command:
      - --mode
      - ${MODE:-whatsapp-api}
      - --mcp-mode
      - ${MCP_MODE:-standalone}
      - --transport
      - ${TRANSPORT:-sse}
      - --sse-port
      - ${SSE_PORT:-3002}
      - --api-port
      - ${API_PORT:-3001}
      - --auth-data-path
      - /app/auth_data
      - --auth-strategy
      - ${AUTH_STRATEGY:-json}
      - --log-level
      - ${LOG_LEVEL:-info}
      - --mongo-uri
      - ${MONGO_URI:-mongodb://admin:password@mongodb:27017/whatsapp_sessions?authSource=admin}
      - --enable-sessions
    depends_on:
      - mongodb
    networks:
      - wweb-network

volumes:
  wweb-auth:
    driver: local
  mongodb-data:
    driver: local

networks:
  wweb-network:
    driver: bridge

